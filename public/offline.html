<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E7490" />
    <title>PTA — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f14;
        --fg: #f4f4f4;
        --muted: #9aa4b2;
        --primary: #0e7490;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: radial-gradient(ellipse at top, rgba(14, 116, 144, 0.18), transparent 55%), var(--bg);
        color: var(--fg);
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 28px 24px;
        background: rgba(20, 26, 34, 0.9);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -0.03em; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        min-height: 48px;
        padding: 0 18px;
        background: var(--primary);
        color: white;
        font-weight: 700;
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">P</div>
      <h1>You’re offline</h1>
      <p>PTA can’t reach the network right now. Your local plans stay on this device — reconnect to sync.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>

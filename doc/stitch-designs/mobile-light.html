<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PTA Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        canvas: '#F4F4F4',
                        surface: '#FFFFFF',
                        inset: '#EEEEEE',
                        primary: '#0E7490',
                        'primary-container': '#CFFAFE',
                        secondary: '#059669',
                        tertiary: '#D97706',
                        'text-primary': '#0F172A',
                        'text-secondary': '#475569',
                        border: '#E2E8F0',
                        danger: '#DC2626'
                    },
                    borderRadius: {
                        DEFAULT: '0.5rem',
                        lg: '1rem',
                        xl: '1.5rem',
                        full: '9999px'
                    },
                    fontFamily: {
                        headline: ['Space Grotesk', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                        label: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.canvas');
            color: theme('colors.text-primary');
            font-family: theme('fontFamily.body');
            -webkit-font-smoothing: antialiased;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 1s ease-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .pulse-btn {
            animation: pulse-soft 2s infinite;
        }

        @keyframes pulse-soft {
            0% { box-shadow: 0 0 0 0 rgba(14, 116, 144, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(14, 116, 144, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 116, 144, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-24 text-text-primary bg-canvas selection:bg-primary-container selection:text-primary relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-[#F4F4F4] border-b border-[#E2E8F0] flat no shadows">
<div class="flex justify-between items-center px-4 py-3 max-w-md mx-auto">
<div class="flex items-center gap-2 text-[#0E7490]">
<span class="material-symbols-outlined hover:opacity-80 transition-opacity" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-headline font-bold text-xl tracking-tight text-[#0F172A]">PTA</span>
</div>
<button class="bg-inset text-tertiary px-3 py-1 rounded-full text-sm font-mono font-bold flex items-center gap-1 hover:opacity-80 transition-opacity active:scale-95 duration-200">
                2450 XP
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="px-4 py-6 max-w-md mx-auto space-y-6">
<!-- Hero Section -->
<section class="bg-surface rounded-xl p-6 shadow-sm border border-border flex flex-col items-center text-center relative overflow-hidden">
<div class="absolute inset-0 bg-primary-container/20 -z-10 rounded-xl"></div>
<p class="text-text-secondary font-label text-sm font-medium mb-1 tracking-wide uppercase">Today's goal</p>
<h2 class="font-headline text-2xl font-bold mb-6">Execution Phase</h2>
<!-- Progress Ring -->
<div class="relative w-40 h-40 mb-8">
<svg class="w-full h-full" viewbox="0 0 120 120">
<circle class="text-inset stroke-current" cx="60" cy="60" fill="transparent" r="54" stroke-width="8"></circle>
<circle class="text-primary stroke-current progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="339.292" stroke-dashoffset="110" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-mono text-3xl font-bold text-primary tracking-tighter">68%</span>
<span class="text-text-secondary text-xs mt-1">Complete</span>
</div>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-white font-label font-bold py-4 rounded-xl pulse-btn hover:bg-primary/90 transition-colors flex justify-center items-center gap-2 active:scale-95 duration-200">
<span>Continue Morning Session</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</section>
<!-- Session Strip -->
<section class="py-2">
<h3 class="font-headline text-sm font-bold text-text-primary mb-3 uppercase tracking-wider">Session Track</h3>
<div class="flex items-center justify-between relative px-2">
<div class="absolute left-6 right-6 top-1/2 -translate-y-1/2 h-0.5 bg-border -z-10"></div>
<div class="absolute left-6 w-[40%] top-1/2 -translate-y-1/2 h-0.5 bg-primary -z-10"></div>
<!-- Completed -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</div>
<!-- Completed -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</div>
<!-- Active -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-surface border-2 border-primary text-primary flex items-center justify-center shadow-md relative">
<div class="w-2.5 h-2.5 bg-primary rounded-full"></div>
</div>
</div>
<!-- Pending -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-inset border border-border text-text-secondary flex items-center justify-center">
</div>
</div>
<!-- Pending -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-inset border border-border text-text-secondary flex items-center justify-center">
</div>
</div>
</div>
</section>
<!-- Tasks List -->
<section>
<div class="flex justify-between items-end mb-4">
<h3 class="font-headline text-lg font-bold text-text-primary">Current Focus</h3>
<span class="text-sm text-text-secondary font-mono">3 Tasks</span>
</div>
<div class="space-y-3">
<!-- Task 1 -->
<label class="flex items-center gap-4 bg-surface p-4 rounded-xl border border-border shadow-sm cursor-pointer group hover:border-primary/50 transition-colors">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-6 h-6 border-2 border-border rounded checked:bg-primary checked:border-primary transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-[18px]">check</span>
</div>
<div class="flex-1">
<p class="font-body text-base font-medium group-hover:text-primary transition-colors line-clamp-1">Review architecture PR</p>
<p class="text-xs text-text-secondary mt-0.5">High Priority • 45m</p>
</div>
<div class="bg-danger/10 text-danger px-2 py-1 rounded text-[10px] font-bold tracking-widest uppercase">
                        P1
                    </div>
</label>
<!-- Task 2 -->
<label class="flex items-center gap-4 bg-surface p-4 rounded-xl border border-border shadow-sm cursor-pointer group hover:border-primary/50 transition-colors">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-6 h-6 border-2 border-border rounded checked:bg-primary checked:border-primary transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-[18px]">check</span>
</div>
<div class="flex-1">
<p class="font-body text-base font-medium group-hover:text-primary transition-colors line-clamp-1">Draft deployment docs</p>
<p class="text-xs text-text-secondary mt-0.5">Focus Work • 1h 30m</p>
</div>
<div class="bg-primary/10 text-primary px-2 py-1 rounded text-[10px] font-bold tracking-widest uppercase">
                        P2
                    </div>
</label>
<!-- Task 3 -->
<label class="flex items-center gap-4 bg-surface p-4 rounded-xl border border-border shadow-sm cursor-pointer group hover:border-primary/50 transition-colors opacity-60">
<div class="relative flex items-center justify-center">
<input checked="" class="peer appearance-none w-6 h-6 border-2 border-border rounded checked:bg-secondary checked:border-secondary transition-colors" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none text-[18px]">check</span>
</div>
<div class="flex-1 line-through text-text-secondary">
<p class="font-body text-base font-medium line-clamp-1">Morning Standup</p>
<p class="text-xs mt-0.5">Completed • 15m</p>
</div>
<span class="text-secondary text-xs font-mono font-bold">+50 XP</span>
</label>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-white border-t border-[#E2E8F0] shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:hidden">
<div class="fixed bottom-0 left-0 right-0 flex justify-around items-center px-2 pb-4 pt-2 max-w-md mx-auto">
<!-- Active: Home -->
<a class="flex flex-col items-center justify-center text-[#0E7490] bg-[#CFFAFE] rounded-xl px-3 py-1 scale-90 transition-transform duration-250 ease-out font-label text-xs font-medium" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
                Home
            </a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-[#475569] px-3 py-1 hover:text-[#0E7490] hover:opacity-80 transition-opacity font-label text-xs font-medium" href="#">
<span class="material-symbols-outlined text-[24px] mb-1">event_note</span>
                Planner
            </a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-[#475569] px-3 py-1 hover:text-[#0E7490] hover:opacity-80 transition-opacity font-label text-xs font-medium" href="#">
<span class="material-symbols-outlined text-[24px] mb-1">calendar_month</span>
                Calendar
            </a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-[#475569] px-3 py-1 hover:text-[#0E7490] hover:opacity-80 transition-opacity font-label text-xs font-medium" href="#">
<span class="material-symbols-outlined text-[24px] mb-1">insert_chart</span>
                Reports
            </a>
<!-- Inactive -->
<a class="flex flex-col items-center justify-center text-[#475569] px-3 py-1 hover:text-[#0E7490] hover:opacity-80 transition-opacity font-label text-xs font-medium" href="#">
<span class="material-symbols-outlined text-[24px] mb-1">person</span>
                Profile
            </a>
</div>
</nav>
</body></html>

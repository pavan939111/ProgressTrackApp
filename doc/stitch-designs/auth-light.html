<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PTA - Sign In</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {},
              "borderRadius": {
                      "DEFAULT": "0.5rem",
                      "lg": "1rem",
                      "xl": "1.5rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Space Grotesk"
                      ],
                      "display": [
                              "Space Grotesk"
                      ],
                      "body": [
                              "Plus Jakarta Sans"
                      ],
                      "label": [
                              "Plus Jakarta Sans"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F4F4F4] text-[#0F172A] font-body antialiased min-h-screen flex flex-col items-center justify-center p-6 selection:bg-[#CFFAFE] selection:text-[#0E7490]">
<!-- Contextual Navigation Suppression: Navigation shells are hidden on this linear transactional screen -->
<div class="w-full max-w-sm flex flex-col items-center w-full animate-[fadeIn_0.5s_ease-out]">
<!-- Brand Header -->
<header class="flex flex-col items-center mb-10 w-full">
<h1 class="font-headline text-6xl font-bold text-[#0F172A] tracking-tighter mb-2">PTA</h1>
<p class="font-body text-[#475569] font-medium text-sm tracking-wide">Plan • Execute • Reflect</p>
</header>
<!-- Main Login Card -->
<main class="w-full bg-[#FFFFFF] rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-[#E2E8F0] p-6 sm:p-8 relative overflow-hidden">
<!-- Subtle atmospheric wash in the background of the card -->
<div class="absolute inset-0 bg-gradient-to-b from-[#FFFFFF] to-[#F8FAFC] pointer-events-none rounded-[2rem]"></div>
<form class="relative z-10 flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Input Group: Email -->
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold text-[#475569] uppercase tracking-wider ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#475569] pointer-events-none">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-[#F4F4F4] border-2 border-transparent focus:border-[#0E7490] focus:bg-[#FFFFFF] focus:ring-0 rounded-xl font-body text-base text-[#0F172A] placeholder-[#475569]/50 transition-all duration-200 outline-none" id="email" placeholder="engineer@example.com" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label text-xs font-bold text-[#475569] uppercase tracking-wider" for="password">Password</label>
<a class="font-body text-xs font-semibold text-[#0E7490] hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#475569] pointer-events-none">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-[#F4F4F4] border-2 border-transparent focus:border-[#0E7490] focus:bg-[#FFFFFF] focus:ring-0 rounded-xl font-body text-base text-[#0F172A] placeholder-[#475569]/50 transition-all duration-200 outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#475569] hover:text-[#0E7490] transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-4">
<button class="w-full h-14 bg-[#0E7490] text-white rounded-xl font-body font-bold text-lg flex items-center justify-center gap-2 hover:bg-[#0c627a] active:scale-[0.98] transition-all duration-200 shadow-md shadow-[#0E7490]/20" type="submit">
                        Sign in
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<button class="w-full h-14 bg-transparent border-2 border-[#0E7490] text-[#0E7490] rounded-xl font-body font-bold text-lg flex items-center justify-center hover:bg-[#CFFAFE]/30 active:scale-[0.98] transition-all duration-200" type="button">
                        Demo mode
                    </button>
</div>
</form>
</main>
<p class="mt-8 text-sm font-body text-[#475569]">
            New to PTA? <a class="font-bold text-[#0E7490] hover:underline" href="#">Start tracking</a>
</p>
</div>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
